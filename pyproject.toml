[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cell-painting-io"
version = "0.1.0"
description = "Read Cell Painting datasets into scverse data structures"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["anndata", "numpy", "pandas"]

[project.optional-dependencies]
notebooks = ["scanpy", "umap-learn", "leidenalg", "matplotlib", "pyarrow"]
spatial = ["scipy", "scikit-image", "spatialdata", "spatialdata-plot", "imageio", "imagecodecs"]
test = ["pytest"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "TID", "SIM", "PTH", "NPY", "PERF", "PIE", "RUF100"]
ignore = [
    "E501",
    "E402", # notebooks import where it reads best
    "B018", # bare expressions render objects in notebooks
]

[tool.pytest.ini_options]
testpaths = ["tests"]

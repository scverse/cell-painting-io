[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cell-painting-io"
version = "0.1.0"
description = "Read Cell Painting datasets into scverse data structures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["anndata"]

[project.optional-dependencies]
notebooks = ["scanpy", "pyarrow"]  # pyarrow only because three datasets ship parquet

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "TID", "SIM", "PTH", "NPY", "PERF", "PIE", "RUF100"]
ignore = [
    "E501",
    "E402", # notebooks import where it reads best
    "B018", # bare expressions render objects in notebooks
]
